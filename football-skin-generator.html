<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Skin Generator — Extremepush</title>
<script>
  // Load JSZip: try local vendor copy first (works offline/Electron), fall back to CDN
  (function(){
    var s=document.createElement('script');
    s.src='vendor/jszip.min.js';
    s.onerror=function(){
      var cdn=document.createElement('script');
      cdn.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      document.head.appendChild(cdn);
    };
    document.head.appendChild(s);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --nr:#0b0918;      /* nav rail */
  --lp:#16122a;      /* left panel */
  --lp2:#1f1a36;     /* left panel hover */
  --lp3:#2a2448;     /* left panel active */
  --acc:#7c3aed;     /* purple accent */
  --acc2:#9d5ff5;    /* accent lighter */
  --acc-glow:rgba(124,58,237,0.35);
  --acc-dim:rgba(124,58,237,0.12);
  --mb:#f7f5ff;      /* main bg */
  --ms:#ffffff;      /* main surface */
  --ms2:#f0edff;     /* main surface 2 */
  --border:rgba(124,58,237,0.14);
  --border2:#e4e0f8;
  --tx:#1a1535;
  --tx2:#6b5e8e;
  --tx3:#a398c8;
  --dk-tx:#c4b8f0;   /* text on dark */
  --dk-tx2:#7b6fa8;  /* secondary text on dark */
  --grn:#10b981;
  --red:#ef4444;
  --amber:#f59e0b;
  --font:'Outfit',system-ui,sans-serif;
  --display:'Syne','Outfit',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{background:var(--nr);color:var(--tx);font-family:var(--font);font-weight:400;height:100vh;overflow:hidden;display:flex;}
.hidden{display:none!important;}

/* ── App shell ── */
.app{display:flex;width:100%;height:100vh;overflow:hidden;}

/* ── Nav Rail ── */
.nav-rail{width:72px;flex-shrink:0;background:var(--nr);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.04);}
.nav-logo{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.nav-logo-text{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:0.04em;background:linear-gradient(135deg,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-items{flex:1;display:flex;flex-direction:column;padding:8px 0;gap:2px;}
.nav-btn{width:100%;height:60px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--dk-tx2);transition:all 0.18s;position:relative;border-radius:0;}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:var(--dk-tx);}
.nav-btn.active{background:rgba(124,58,237,0.15);color:#a78bfa;}
.nav-btn.active::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--acc);border-radius:0 3px 3px 0;}
.nav-icon{font-size:18px;line-height:1;}
.nav-label{font-family:var(--font);font-size:9px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;}
.nav-footer{padding:10px 6px;border-top:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.nav-chips-row{display:flex;flex-direction:column;gap:3px;}
.nav-chip{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);color:var(--dk-tx2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-chip.ok{border-color:rgba(16,185,129,0.4);color:#34d399;}
.nav-chip.warn{border-color:rgba(245,158,11,0.4);color:#fbbf24;}
.nav-load-btn{position:relative;overflow:hidden;background:var(--acc);color:#fff;border:none;border-radius:6px;padding:6px 4px;font-family:var(--font);font-size:9px;font-weight:600;letter-spacing:0.03em;text-align:center;cursor:pointer;line-height:1.3;transition:background 0.15s;}
.nav-load-btn:hover{background:var(--acc2);}
.nav-load-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.nav-status{font-family:var(--mono);font-size:8px;color:var(--dk-tx2);text-align:center;min-height:10px;word-break:break-all;}

/* ── App Main ── */
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--mb);}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pane-split{display:flex;flex:1;overflow:hidden;}

/* ── Left Panel (dark) ── */
.left-panel{width:230px;flex-shrink:0;background:var(--lp);display:flex;flex-direction:column;border-right:1px solid rgba(0,0,0,0.2);}
.lp-header{height:44px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.lp-title{font-family:var(--display);font-size:11px;font-weight:600;color:var(--dk-tx);letter-spacing:0.06em;text-transform:uppercase;flex:1;}
.lp-body{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:rgba(124,58,237,0.3) transparent;}
.lp-body::-webkit-scrollbar{width:4px;}
.lp-body::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px;}
.lp-footer{padding:8px;border-top:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.lp-status{font-family:var(--mono);font-size:9px;min-height:12px;padding:0 2px;}
.lp-status.ok{color:var(--grn);}
.lp-status.err{color:var(--red);}

/* ── Dark buttons (for left panel) ── */
.dk-btn{height:26px;padding:0 10px;border-radius:5px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--dk-tx);font-family:var(--font);font-size:10px;font-weight:500;cursor:pointer;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.dk-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15);}
.dk-btn-acc{background:var(--acc);border-color:var(--acc);color:#fff;}
.dk-btn-acc:hover{background:var(--acc2);}
.dk-btn-sm{height:22px;padding:0 8px;font-size:9px;}

/* ── Asset items (left panel) ── */
.asset-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background 0.12s;border:1.5px solid transparent;margin-bottom:2px;}
.asset-item:hover{background:var(--lp2);}
.asset-item.active{background:var(--lp3);border-color:rgba(124,58,237,0.4);}
.asset-thumb{width:38px;height:26px;border-radius:4px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);object-fit:contain;image-rendering:pixelated;flex-shrink:0;}
.asset-info{flex:1;min-width:0;}
.asset-name{font-size:10px;font-weight:500;color:var(--dk-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-meta{font-size:8px;font-family:var(--mono);color:var(--dk-tx2);}
.asset-dots{display:flex;gap:3px;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.12);}
.dot.done{background:var(--grn);}
.dot.partial{background:var(--amber);}

/* ── Casino items ── */
.casino-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background 0.12s;border:1.5px solid transparent;margin-bottom:2px;}
.casino-item:hover{background:var(--lp2);}
.casino-item.active{background:var(--lp3);border-color:rgba(124,58,237,0.4);}
.casino-color-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);flex-shrink:0;}
.casino-item-name{font-size:11px;font-weight:500;color:var(--dk-tx);flex:1;}
.casino-item-id{font-size:8px;font-family:var(--mono);color:var(--dk-tx2);}

/* ── Right/Main editor area ── */
.editor-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--mb);}
.editor-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:14px;font-weight:300;}
.editor-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#editorActive{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ── Editor toolbar ── */
.editor-toolbar{height:44px;padding:0 10px;border-bottom:1px solid var(--border2);background:var(--ms);display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto;}
.editor-toolbar::-webkit-scrollbar{height:0;}
.tool-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0;margin:0 2px;}
.tool-group{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.rtab{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--border2);background:var(--ms);font-family:var(--font);font-size:11px;font-weight:500;color:var(--tx2);cursor:pointer;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.rtab:hover{border-color:var(--acc-dim);color:var(--tx);}
.rtab.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.rtab-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.4);display:inline-block;}
.rtab.active .rtab-dot{background:rgba(255,255,255,0.6);}
.rtab-dot.has-mask{background:var(--grn);}
.rtab.active .rtab-dot.has-mask{background:rgba(255,255,255,0.9);}
.tbtn{height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--border2);background:var(--ms);color:var(--tx2);font-family:var(--font);font-size:10px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);}
.tbtn.active{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 3px var(--acc-dim);}
.tbtn.danger:hover{border-color:var(--red);color:var(--red);}
.tol-label{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;}
.tol-slider{width:72px;height:3px;-webkit-appearance:none;appearance:none;background:var(--border2);border-radius:2px;outline:none;cursor:pointer;}
.tol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ms);border:2px solid var(--acc);cursor:pointer;}
.tol-val{font-size:10px;font-family:var(--mono);color:var(--tx2);min-width:22px;}
.px-input{width:38px;height:26px;border:1px solid var(--border2);border-radius:5px;background:var(--ms);color:var(--tx);font-family:var(--mono);font-size:10px;text-align:center;outline:none;padding:0 4px;}
.px-input:focus{border-color:var(--acc);}
.toolbar-status{font-size:10px;font-family:var(--mono);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.toolbar-status.ok{color:var(--grn);}
.toolbar-status.err{color:var(--red);}

/* ── Canvas wrap ── */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#d8d4f0;user-select:none;}
.checker{position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(0,0,0,0.08) 25%,transparent 25%),linear-gradient(-45deg,rgba(0,0,0,0.08) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(0,0,0,0.08) 75%),linear-gradient(-45deg,transparent 75%,rgba(0,0,0,0.08) 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;pointer-events:none;}
.canvas-center{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.canvas-stack{position:relative;display:inline-block;transform-origin:center center;}
#meCanvas,#meOverlay{display:block;image-rendering:pixelated;}
#meOverlay{position:absolute;top:0;left:0;pointer-events:none;}
.zoom-ctrl{position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--border2);border-radius:20px;padding:3px 8px;z-index:10;}
.zoom-ctrl span{font-size:10px;font-family:var(--mono);min-width:34px;text-align:center;color:var(--tx);}
.zoom-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--tx2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1;transition:all 0.12s;}
.zoom-btn:hover{border-color:var(--acc);color:var(--acc);}

/* ── Anim sidebar ── */
.anim-sidebar{width:170px;flex-shrink:0;border-left:1px solid var(--border2);background:var(--ms);display:flex;flex-direction:column;padding:10px;}
.anim-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--tx3);margin-bottom:8px;}
.anim-canvas-wrap{background:var(--ms2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:70px;margin-bottom:8px;border:1px solid var(--border2);}
#meAnimCanvas{max-width:148px;max-height:110px;display:block;image-rendering:pixelated;}
.anim-ctrls{display:flex;align-items:center;gap:8px;}
.anim-play-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border2);background:var(--ms);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.anim-play-btn:hover{border-color:var(--acc);color:var(--acc);}
.anim-info{font-size:10px;font-family:var(--mono);color:var(--tx2);}

/* ── Frame strip ── */
.frame-strip-area{flex-shrink:0;border-top:1px solid var(--border2);background:var(--ms);}
.frame-strip{display:flex;gap:3px;padding:6px 8px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(124,58,237,0.2) transparent;}
.frame-strip::-webkit-scrollbar{height:3px;}
.frame-strip::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px;}
.fs-thumb{flex-shrink:0;border-radius:3px;border:2px solid transparent;cursor:pointer;display:block;image-rendering:pixelated;transition:border-color 0.12s;}
.fs-thumb.active{border-color:var(--acc);}
.frame-controls{display:flex;align-items:center;gap:6px;padding:4px 8px 6px;flex-wrap:wrap;}
.frame-label{font-size:10px;font-family:var(--mono);color:var(--tx2);}
.btn-ghost-sm{height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--tx2);font-family:var(--font);font-size:10px;cursor:pointer;transition:all 0.12s;}
.btn-ghost-sm:hover{border-color:var(--acc);color:var(--acc);}
.hint-text{font-size:9px;color:var(--tx3);}

/* ── Main buttons ── */
.btn{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--border2);background:var(--ms);color:var(--tx);font-family:var(--font);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--acc);color:var(--acc);}
.btn:disabled{opacity:0.4;pointer-events:none;}
.btn-sm{height:26px;padding:0 10px;font-size:10px;}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
.btn-acc:hover{background:var(--acc2);border-color:var(--acc2);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx2);}
.btn-ghost:hover{background:var(--ms2);color:var(--tx);}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}
.btn-danger:hover{background:#dc2626;border-color:#dc2626;}

/* ── Preset form ── */
.form-area{flex:1;overflow-y:auto;padding:16px 18px;}
.form-section{margin-bottom:18px;}
.form-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--tx3);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border2);}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
.form-label{font-size:11px;color:var(--tx2);min-width:96px;flex-shrink:0;font-weight:500;}
.form-input{flex:1;min-width:0;height:30px;padding:0 10px;border:1px solid var(--border2);border-radius:7px;background:var(--ms);color:var(--tx);font-family:var(--font);font-size:11px;outline:none;transition:border 0.15s;}
.form-input:focus{border-color:var(--acc);}
select.form-input{cursor:pointer;}
.color-wrap{display:flex;align-items:center;gap:7px;}
.color-swatch{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;transition:border-color 0.15s;}
.color-swatch:hover{border-color:var(--acc);}
.color-hex{width:76px;height:30px;padding:0 8px;border:1px solid var(--border2);border-radius:7px;background:var(--ms);font-family:var(--mono);font-size:11px;color:var(--tx);outline:none;transition:border 0.15s;}
.color-hex:focus{border-color:var(--acc);}
input[type=color]{width:0;height:0;opacity:0;position:absolute;}
.range-row{display:flex;align-items:center;gap:8px;flex:1;}
.range-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:var(--border2);border-radius:2px;outline:none;}
.range-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ms);border:2px solid var(--acc);cursor:pointer;}
.range-val{font-size:10px;font-family:var(--mono);color:var(--tx2);min-width:28px;text-align:right;}
.form-actions-bar{display:flex;gap:7px;padding:10px 16px;border-top:1px solid var(--border2);background:var(--ms);flex-shrink:0;align-items:center;}

/* ── Generator ── */
.gen-status-bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border2);background:var(--ms);flex-shrink:0;flex-wrap:wrap;}
.gen-status-card{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--ms2);}
.gen-status-card.ok{border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.06);}
.gen-status-card.err{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05);}
.gen-status-icon{font-size:14px;}
.gen-status-text{font-size:11px;font-weight:600;color:var(--tx);}
.gen-status-sub{font-size:9px;font-family:var(--mono);color:var(--tx3);}
.gen-preview{flex:1;display:flex;align-items:center;justify-content:center;background:#d8d4f0;overflow:hidden;}
.gen-preview canvas{max-width:100%;max-height:100%;image-rendering:pixelated;}
.gen-preview-msg{color:var(--tx2);font-size:13px;font-weight:300;}
.gen-controls{padding:12px 16px;border-bottom:1px solid var(--border2);background:var(--ms);flex-shrink:0;display:flex;flex-direction:column;gap:9px;}
.gen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.gen-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--tx3);min-width:70px;flex-shrink:0;}
.radio-group{display:flex;gap:10px;flex-wrap:wrap;}
.radio-group label{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;color:var(--tx2);}
.radio-group input{accent-color:var(--acc);}
.gen-bottom{flex-shrink:0;border-top:1px solid var(--border2);padding:10px 16px;background:var(--ms);display:flex;flex-direction:column;gap:7px;}
.gen-export-row{display:flex;align-items:center;gap:10px;}
.progress-bar-wrap{width:100%;height:4px;background:var(--border2);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 0.25s;width:0%;}
.progress-log{font-size:10px;font-family:var(--mono);color:var(--tx2);max-height:80px;overflow-y:auto;line-height:1.7;}
.progress-log .log-ok{color:var(--grn);}
.progress-log .log-err{color:var(--red);}
.st{font-size:10px;font-family:var(--mono);color:var(--tx2);min-height:14px;}
.st.ok{color:var(--grn);}.st.err{color:var(--red);}
</style>
</head>
<body>
<div class="app">

<!-- ══ NAV RAIL ══ -->
<nav class="nav-rail">
  <div class="nav-logo"><span class="nav-logo-text">FSG</span></div>
  <div class="nav-items">
    <button class="nav-btn active" id="nbMask" onclick="switchTab('mask')">
      <div class="nav-icon">⬡</div>
      <div class="nav-label">Masks</div>
    </button>
    <button class="nav-btn" id="nbPresets" onclick="switchTab('presets')">
      <div class="nav-icon">◈</div>
      <div class="nav-label">Presets</div>
    </button>
    <button class="nav-btn" id="nbGen" onclick="switchTab('gen')">
      <div class="nav-icon">⚡</div>
      <div class="nav-label">Export</div>
    </button>
  </div>

<script>
'use strict';
// ═══════════════════════════════════════
//  CONSTANTS & REGISTRY
// ═══════════════════════════════════════
const REGISTRY = [
  {key:'player',      file:'player.webp',                w:590, h:590, frames:17, type:'player'},
  {key:'gk_idle',     file:'goalkeeper_idle.webp',        w:918, h:360, frames:5,  type:'goalkeeper'},
  {key:'gk_left',     file:'goalkeeper_left.webp',        w:918, h:360, frames:10, type:'goalkeeper'},
  {key:'gk_right',    file:'goalkeeper_right.webp',       w:918, h:360, frames:10, type:'goalkeeper'},
  {key:'gk_center',   file:'goalkeeper_center.webp',      w:918, h:360, frames:4,  type:'goalkeeper'},
  {key:'gk_left_h',   file:'goalkeeper_left_high.webp',   w:918, h:360, frames:11, type:'goalkeeper'},
  {key:'gk_right_h',  file:'goalkeeper_right_high.webp',  w:918, h:360, frames:11, type:'goalkeeper'},
  {key:'gk_center_h', file:'goalkeeper_center_high.webp', w:918, h:360, frames:10, type:'goalkeeper'},
  {key:'ball',        file:'ball.webp',                   w:61,  h:69,  frames:6,  type:'ball'},
];
const REGION_COLORS = {shirt:'rgba(0,200,100,0.45)',socks:'rgba(60,140,255,0.45)',number:'rgba(255,160,0,0.45)'};

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const loadedAssets = {};
const maskLib = {};
let staticFiles = {};
let presets = [];
let currentPresetId = null;

let me = {
  key: null, frameIdx: 0, region: 'shirt',
  tool: 'lasso',
  zoom: 1, panX: 0, panY: 0,
  panning: false, panStartX: 0, panStartY: 0,
  lassoPts: [], lassoing: false, lassoExclude: false,
  animPlaying: false, animIdx: 0, animRAF: null, animLast: 0, animAccum: 0,
};

let genBeforeFrames = null;
let genAfterFrames = null;
let genShowAfter = false;
let genAnimRAF = null;
let genAnimIdx = 0;
let genAnimLast = 0;
let genAnimFrames = null, genAnimDurs = null;

const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 40;

// ═══════════════════════════════════════
//  UNDO / REDO
// ═══════════════════════════════════════
function pushHistory() {
  if (!me.key) return;
  const mask = maskLib[me.key]?.[me.region]?.[me.frameIdx];
  undoStack.push({key:me.key, region:me.region, frameIdx:me.frameIdx, mask:mask?new Uint8Array(mask):null});
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedo();
}

function doUndo() {
  if (!undoStack.length) return;
  const entry = undoStack.pop();
  const cur = maskLib[entry.key]?.[entry.region]?.[entry.frameIdx];
  redoStack.push({key:entry.key, region:entry.region, frameIdx:entry.frameIdx, mask:cur?new Uint8Array(cur):null});
  if (!maskLib[entry.key]) initMaskLib(entry.key, loadedAssets[entry.key]?.frames.length||0);
  maskLib[entry.key][entry.region][entry.frameIdx] = entry.mask?new Uint8Array(entry.mask):null;
  if (entry.key !== me.key) { me.key = entry.key; initMaskEditor(entry.key); return; }
  if (entry.region !== me.region) setRegion(entry.region);
  if (entry.frameIdx !== me.frameIdx) loadMeFrame(entry.frameIdx);
  drawMeOverlay(); updateRegionDots(); renderAssetGrid();
  setSt('editorStatus','Undo','ok');
  updateUndoRedo();
}

function doRedo() {
  if (!redoStack.length) return;
  const entry = redoStack.pop();
  const cur = maskLib[entry.key]?.[entry.region]?.[entry.frameIdx];
  undoStack.push({key:entry.key, region:entry.region, frameIdx:entry.frameIdx, mask:cur?new Uint8Array(cur):null});
  if (!maskLib[entry.key]) initMaskLib(entry.key, loadedAssets[entry.key]?.frames.length||0);
  maskLib[entry.key][entry.region][entry.frameIdx] = entry.mask?new Uint8Array(entry.mask):null;
  if (entry.key !== me.key) { me.key = entry.key; initMaskEditor(entry.key); return; }
  if (entry.region !== me.region) setRegion(entry.region);
  if (entry.frameIdx !== me.frameIdx) loadMeFrame(entry.frameIdx);
  drawMeOverlay(); updateRegionDots(); renderAssetGrid();
  setSt('editorStatus','Redo','ok');
  updateUndoRedo();
}

function updateUndoRedo() {
  const ub=document.getElementById('tbnUndo'), rb=document.getElementById('tbnRedo');
  if(ub){ub.disabled=!undoStack.length;ub.style.opacity=undoStack.length?'':'0.4';}
  if(rb){rb.disabled=!redoStack.length;rb.style.opacity=redoStack.length?'':'0.4';}
}

function doSmooth() {
  if (!me.key) return;
  const mc=document.getElementById('meCanvas');
  const w=mc.width, h=mc.height;
  if (!maskLib[me.key][me.region][me.frameIdx]) { setSt('editorStatus','No mask on this frame','err'); return; }
  pushHistory();
  // Morphological open: erode 2 then dilate 2 — removes isolated speckles, smooths jagged edges
  for (let i=0;i<2;i++) {
    const m=maskLib[me.key][me.region][me.frameIdx], nx=new Uint8Array(m);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(!m[y*w+x]) continue;
      if(x===0||x===w-1||y===0||y===h-1||!m[y*w+x-1]||!m[y*w+x+1]||!m[(y-1)*w+x]||!m[(y+1)*w+x]) nx[y*w+x]=0;
    }
    maskLib[me.key][me.region][me.frameIdx]=nx;
  }
  for (let i=0;i<2;i++) {
    const m=maskLib[me.key][me.region][me.frameIdx], nx=new Uint8Array(m);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(m[y*w+x]) continue;
      if((x>0&&m[y*w+x-1])||(x<w-1&&m[y*w+x+1])||(y>0&&m[(y-1)*w+x])||(y<h-1&&m[(y+1)*w+x])) nx[y*w+x]=1;
    }
    maskLib[me.key][me.region][me.frameIdx]=nx;
  }
  drawMeOverlay(); updateRegionDots();
  setSt('editorStatus','Edges smoothed','ok');
}

// ═══════════════════════════════════════
//  WEBP DECODER
// ═══════════════════════════════════════
async function decodeWebP(file) {
  const frames = [], durations = [];
  try {
    if (typeof ImageDecoder !== 'undefined') {
      const buf = await file.arrayBuffer();
      const dec = new ImageDecoder({data: buf, type: 'image/webp'});
      await dec.tracks.ready;
      try { await dec.completed; } catch(e) {}
      const count = dec.tracks.selectedTrack.frameCount || 1;
      for (let i = 0; i < count; i++) {
        try {
          const r = await dec.decode({frameIndex: i});
          const vf = r.image;
          const c = document.createElement('canvas');
          c.width = vf.displayWidth; c.height = vf.displayHeight;
          c.getContext('2d').drawImage(vf, 0, 0);
          durations.push(vf.duration ? vf.duration / 1000 : 100);
          vf.close();
          frames.push(c);
        } catch(e) { break; }
      }
      dec.close();
    }
    if (!frames.length) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        frames.push(c); durations.push(100);
      } finally { URL.revokeObjectURL(url); }
    }
  } catch(e) { throw e; }
  if (!frames.length) throw new Error('No frames decoded');
  return {frames, durations};
}

// ═══════════════════════════════════════
//  WEBP ENCODER
// ═══════════════════════════════════════
function s2b(s) { return new Uint8Array([...s].map(c => c.charCodeAt(0))); }
function wU32(b, o, v) { b[o]=v&0xFF; b[o+1]=(v>>8)&0xFF; b[o+2]=(v>>16)&0xFF; b[o+3]=(v>>24)&0xFF; }
function wU24(b, o, v) { b[o]=v&0xFF; b[o+1]=(v>>8)&0xFF; b[o+2]=(v>>16)&0xFF; }
function rU32(b, o) { return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0; }
function rFCC(b, o) { return String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]); }

function mkChunk(tag, payload) {
  const sz = payload.length, pad = sz%2?sz+1:sz;
  const c = new Uint8Array(8+pad);
  c.set(s2b(tag)); wU32(c,4,sz); c.set(payload,8); return c;
}

function extractFrameData(wb) {
  if (rFCC(wb,0)!=='RIFF'||rFCC(wb,8)!=='WEBP') return {data:wb,hasAlpha:false};
  const chunks = []; let off = 12, hasAlpha = false;
  while (off+8 <= wb.length) {
    const tag = rFCC(wb,off), sz = rU32(wb,off+4);
    const end = off+8+sz+(sz%2?1:0);
    if (tag==='VP8 '||tag==='VP8L'||tag==='ALPH') {
      chunks.push(wb.slice(off, Math.min(end,wb.length)));
      if (tag==='ALPH'||tag==='VP8L') hasAlpha = true;
    }
    off = end;
  }
  if (!chunks.length) return {data:wb.slice(12),hasAlpha:false};
  const total = chunks.reduce((s,c)=>s+c.length,0);
  const res = new Uint8Array(total); let pos = 0;
  for (const c of chunks) { res.set(c,pos); pos+=c.length; }
  return {data:res,hasAlpha};
}

async function encodeAnimatedWebP(frames, durations, quality=0.88) {
  const frameBytes = [];
  for (let i = 0; i < frames.length; i++) {
    const blob = await new Promise((res,rej) => frames[i].toBlob(b => b?res(b):rej(new Error('toBlob failed')), 'image/webp', quality));
    frameBytes.push(new Uint8Array(await blob.arrayBuffer()));
  }
  const w = frames[0].width, h = frames[0].height;
  const fd = frameBytes.map(fb => extractFrameData(fb));
  const anyAlpha = fd.some(f => f.hasAlpha);

  const vp8xP = new Uint8Array(10);
  vp8xP[0] = 0x02 | (anyAlpha ? 0x10 : 0);
  wU24(vp8xP,4,w-1); wU24(vp8xP,7,h-1);
  const vp8xC = mkChunk('VP8X', vp8xP);
  const animC = mkChunk('ANIM', new Uint8Array(6));

  const anmfChunks = fd.map((f,i) => {
    const dur = Math.max(1, Math.round(durations[i]||100));
    const p = new Uint8Array(16+f.data.length);
    wU24(p,0,0); wU24(p,3,0); wU24(p,6,w-1); wU24(p,9,h-1);
    wU24(p,12,dur); p[15]=0x02; p.set(f.data,16);
    return mkChunk('ANMF',p);
  });

  let bodySize = 4+vp8xC.length+animC.length;
  for (const c of anmfChunks) bodySize += c.length;
  const out = new Uint8Array(8+bodySize); let off = 0;
  out.set(s2b('RIFF'),off); off+=4; wU32(out,off,bodySize); off+=4;
  out.set(s2b('WEBP'),off); off+=4;
  out.set(vp8xC,off); off+=vp8xC.length;
  out.set(animC,off); off+=animC.length;
  for (const c of anmfChunks) { out.set(c,off); off+=c.length; }
  return new Blob([out], {type:'image/webp'});
}

// ═══════════════════════════════════════
//  ASSET LOADING
// ═══════════════════════════════════════
document.getElementById('folderInput').addEventListener('change', async function(e) {
  const files = Array.from(e.target.files||[]);
  if (!files.length) return;
  setSt('folderStatus','Loading…');
  const byName = {};
  for (const f of files) {
    if (f.webkitRelativePath.includes('__MACOSX') || f.name.startsWith('._')) continue;
    byName[f.name.toLowerCase()] = f;
  }
  for (const [name, file] of Object.entries(byName)) {
    if (!name.endsWith('.webp')) staticFiles[name] = file;
  }
  let loaded = 0;
  for (const def of REGISTRY) {
    const f = byName[def.file.toLowerCase()];
    if (!f) continue;
    try {
      const res = await decodeWebP(f);
      loadedAssets[def.key] = res;
      if (!maskLib[def.key]) initMaskLib(def.key, res.frames.length);
      loaded++;
    } catch(err) { console.error(`Failed ${def.file}:`, err); }
  }
  setSt('folderStatus', `${loaded}/${REGISTRY.length} assets`, loaded>0?'ok':'err');
  updateChips();
  renderAssetGrid();
  renderGenStatus();
  renderGenCasinoList();
  e.target.value = '';
});

function setSt(id, msg, type='') {
  const el=document.getElementById(id); if(!el) return;
  el.textContent=msg; el.className=(id==='maskStatus'||id==='presetStatus')?'lp-status'+(type?' '+type:''):'st'+(type?' '+type:'');
}

function initMaskLib(key, frameCount) {
  maskLib[key] = {
    shirt:   new Array(frameCount).fill(null),
    socks:   new Array(frameCount).fill(null),
    number:  new Array(frameCount).fill(null),
    anchors: new Array(frameCount).fill(null),
  };
}

// ═══════════════════════════════════════
//  MASK LIBRARY SAVE / LOAD
// ═══════════════════════════════════════
function saveMaskLibrary() {
  const out = {version:2};
  for (const key of Object.keys(maskLib)) {
    const ml = maskLib[key];
    out[key] = {};
    for (const region of ['shirt','socks','number']) {
      out[key][region] = (ml[region]||[]).map(m => {
        if (!m) return null;
        let bin = ''; for (let i=0;i<m.length;i++) bin+=String.fromCharCode(m[i]);
        return btoa(bin);
      });
    }
    out[key].anchors = ml.anchors||[];
  }
  dlBlob(new Blob([JSON.stringify(out)], {type:'application/json'}), 'mask_library.json');
  setSt('maskStatus','Saved mask_library.json','ok');
}

async function loadMaskLibraryFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    for (const key of Object.keys(data)) {
      if (key==='version') continue;
      const entry = data[key];
      const def = REGISTRY.find(d=>d.key===key);
      if (!def) continue;
      const frameCount = entry.shirt?.length || def.frames;
      if (!maskLib[key]) initMaskLib(key, frameCount);
      for (const region of ['shirt','socks','number']) {
        if (!entry[region]) continue;
        entry[region].forEach((b64,fi) => {
          if (!b64) { maskLib[key][region][fi]=null; return; }
          const bin=atob(b64), arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
          maskLib[key][region][fi]=arr;
        });
      }
      if (entry.anchors) maskLib[key].anchors = entry.anchors;
    }
    setSt('maskStatus','Loaded mask library','ok');
    updateChips(); renderAssetGrid();
    if (me.key) drawMeOverlay();
  } catch(e) { setSt('maskStatus','Error: '+e.message,'err'); }
}

function getMaskCoverage(key) {
  if (!maskLib[key]) return {shirt:0,socks:0,total:0,needed:0};
  const def = REGISTRY.find(d=>d.key===key);
  const n = def?.frames||0;
  const shirt = maskLib[key].shirt.filter(m=>m&&m.some(v=>v>0)).length;
  const socks = maskLib[key].socks.filter(m=>m&&m.some(v=>v>0)).length;
  return {shirt, socks, total:shirt+socks, needed:n*2};
}

// ═══════════════════════════════════════
//  ASSET GRID
// ═══════════════════════════════════════
function renderAssetGrid() {
  const el = document.getElementById('assetGrid');
  el.innerHTML = '';
  for (const def of REGISTRY) {
    const loaded = !!loadedAssets[def.key];
    const cov = getMaskCoverage(def.key);
    const div = document.createElement('div');
    div.className = 'asset-item' + (me.key===def.key?' active':'');
    div.onclick = () => initMaskEditor(def.key);

    const thumb = document.createElement('canvas');
    thumb.className = 'asset-thumb';
    thumb.width = 38; thumb.height = 26;
    if (loaded) {
      const f = loadedAssets[def.key].frames[0];
      const scale = Math.min(38/f.width, 26/f.height);
      const tw = Math.round(f.width*scale), th = Math.round(f.height*scale);
      thumb.getContext('2d').drawImage(f, Math.round((38-tw)/2), Math.round((26-th)/2), tw, th);
    }
    div.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'asset-info';
    info.innerHTML = `<div class="asset-name" title="${def.file}">${def.file.replace('.webp','')}</div>
      <div class="asset-meta">${loaded?loadedAssets[def.key].frames.length+'fr':'not loaded'}</div>`;
    div.appendChild(info);

    const dots = document.createElement('div');
    dots.className = 'asset-dots';
    const nFrames = REGISTRY.find(d=>d.key===def.key)?.frames||0;
    const sd = document.createElement('div');
    sd.className = 'dot'+(cov.shirt>0?(cov.shirt===nFrames?' done':' partial'):'');
    sd.title = `Shirt: ${cov.shirt}/${nFrames} frames`;
    const kd = document.createElement('div');
    kd.className = 'dot'+(cov.socks>0?(cov.socks===nFrames?' done':' partial'):'');
    kd.title = `Socks: ${cov.socks}/${nFrames} frames`;
    dots.appendChild(sd); dots.appendChild(kd);
    div.appendChild(dots);
    el.appendChild(div);
  }
}

// ═══════════════════════════════════════
//  MASK EDITOR — INIT
// ═══════════════════════════════════════
function initMaskEditor(key) {
  const def = REGISTRY.find(d=>d.key===key);
  if (!def) return;
  if (!loadedAssets[key]) { setSt('editorStatus','Asset not loaded','err'); return; }

  me.key = key;
  me.frameIdx = 0;
  me.zoom = 1; me.panX = 0; me.panY = 0;

  document.getElementById('rtabNumber').style.display = def.type==='player'?'':'none';
  document.getElementById('tbnAnchor').style.display = def.type==='player'?'':'none';

  document.getElementById('editorEmpty').classList.add('hidden');
  document.getElementById('editorActive').classList.remove('hidden');

  renderAssetGrid();
  buildMeStrip();
  loadMeFrame(0);
  startMeAnim();
}

function setRegion(r) {
  me.region = r;
  ['shirt','socks','number'].forEach(rr => {
    document.getElementById('rtab'+cap(rr)).classList.toggle('active', rr===r);
  });
  if (r==='number') meTool('anchor');
  else meTool('lasso');
  drawMeOverlay();
}

function cap(s) { return s.charAt(0).toUpperCase()+s.slice(1); }

// ═══════════════════════════════════════
//  MASK EDITOR — FRAME NAV
// ═══════════════════════════════════════
function buildMeStrip() {
  const strip = document.getElementById('meStrip');
  strip.innerHTML = '';
  if (!me.key) return;
  const frames = loadedAssets[me.key].frames;
  frames.forEach((f, i) => {
    const th = 32, tw = Math.round(th * f.width / f.height);
    const c = document.createElement('canvas');
    c.width = tw; c.height = th;
    c.className = 'fs-thumb' + (i===me.frameIdx?' active':'');
    c.getContext('2d').drawImage(f,0,0,tw,th);
    c.addEventListener('click', () => loadMeFrame(i));
    strip.appendChild(c);
  });
}

function updateMeStrip() {
  document.querySelectorAll('#meStrip .fs-thumb').forEach((t,i) => t.classList.toggle('active', i===me.frameIdx));
  const active = document.querySelector('#meStrip .fs-thumb.active');
  if (active) active.scrollIntoView({block:'nearest',inline:'nearest'});
}

function loadMeFrame(idx) {
  if (!me.key) return;
  const frames = loadedAssets[me.key].frames;
  me.frameIdx = Math.max(0, Math.min(idx, frames.length-1));
  const f = frames[me.frameIdx];

  const mc = document.getElementById('meCanvas');
  mc.width = f.width; mc.height = f.height;
  mc.getContext('2d').drawImage(f,0,0);

  const mo = document.getElementById('meOverlay');
  mo.width = f.width; mo.height = f.height;

  document.getElementById('meFrameLabel').textContent = `Frame ${me.frameIdx+1}/${frames.length}`;
  updateMeStrip();
  meFitCanvas();
  meApplyTransform();
  drawMeOverlay();
  updateRegionDots();
  setSt('editorStatus','');
}

function meFitCanvas() {
  const inner = document.getElementById('meCanvasInner');
  const mc = document.getElementById('meCanvas');
  if (!mc.width) return;
  const ww = inner.clientWidth||600, wh = inner.clientHeight||400;
  me.zoom = Math.max(0.2, Math.min(ww/mc.width, wh/mc.height)*0.88);
  me.panX = 0; me.panY = 0;
}

function meApplyTransform() {
  document.getElementById('meCanvasStack').style.transform = `translate(${me.panX}px,${me.panY}px) scale(${me.zoom})`;
  document.getElementById('meZoomLabel').textContent = Math.round(me.zoom*100)+'%';
}

function meZoomAdj(d) {
  const old=me.zoom; me.zoom=Math.min(8,Math.max(0.2,me.zoom+d));
  const r=me.zoom/old; me.panX*=r; me.panY*=r;
  meApplyTransform();
}

// ═══════════════════════════════════════
//  MASK EDITOR — OVERLAY
// ═══════════════════════════════════════
function drawMeOverlay() {
  if (!me.key) return;
  const mc = document.getElementById('meCanvas');
  const mo = document.getElementById('meOverlay');
  if (!mc.width) return;
  mo.width = mc.width; mo.height = mc.height;
  const ctx = mo.getContext('2d');
  ctx.clearRect(0,0,mo.width,mo.height);

  const order = ['shirt','socks','number'].filter(r=>r!==me.region).concat([me.region]);
  for (const region of order) {
    const mask = maskLib[me.key]?.[region]?.[me.frameIdx];
    if (!mask) continue;
    const col = REGION_COLORS[region];
    const id = ctx.createImageData(mo.width, mo.height);
    const [r,g,b,a] = parseRgba(col);
    for (let i=0;i<mask.length;i++) {
      if (!mask[i]) continue;
      id.data[i*4]=r; id.data[i*4+1]=g; id.data[i*4+2]=b; id.data[i*4+3]=a;
    }
    ctx.putImageData(id,0,0);
  }

  const anchor = maskLib[me.key]?.anchors?.[me.frameIdx];
  if (anchor) {
    ctx.save();
    ctx.strokeStyle='rgba(255,160,0,0.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(anchor.x,anchor.y,12,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,160,0,0.9)';ctx.font='bold 14px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('#',anchor.x,anchor.y);
    ctx.restore();
  }
}

function parseRgba(s) {
  const m=s.match(/rgba\((\d+),(\d+),(\d+),([\d.]+)\)/);
  return m?[+m[1],+m[2],+m[3],Math.round(+m[4]*255)]:[0,0,0,100];
}

function updateRegionDots() {
  if (!me.key) return;
  for (const r of ['shirt','socks','number']) {
    const masks = maskLib[me.key]?.[r]||[];
    const hasSome = masks.some(m=>m&&m.some(v=>v>0));
    const dot = document.getElementById('rdot'+cap(r));
    if (dot) dot.className='rtab-dot'+(hasSome?' has-mask':'');
  }
}

// ═══════════════════════════════════════
//  MASK EDITOR — TOOLS
// ═══════════════════════════════════════
function meGetCoords(e) {
  const inner = document.getElementById('meCanvasInner');
  const ir = inner.getBoundingClientRect();
  const mc = document.getElementById('meCanvas');
  const cx=mc.width/2, cy=mc.height/2;
  const sx=e.clientX-(ir.left+ir.width/2)-me.panX;
  const sy=e.clientY-(ir.top+ir.height/2)-me.panY;
  return {
    x:Math.max(0,Math.min(mc.width-1,Math.round(sx/me.zoom+cx))),
    y:Math.max(0,Math.min(mc.height-1,Math.round(sy/me.zoom+cy))),
  };
}

function meTool(t) {
  me.tool = t;
  const map = {lasso:'tbnLasso', wand:'tbnWand', range:'tbnRange', anchor:'tbnAnchor'};
  for (const [tool, id] of Object.entries(map)) {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', tool===t);
  }
  document.getElementById('meCanvasWrap').style.cursor = 'crosshair';
}

const wrap = document.getElementById('meCanvasWrap');

wrap.addEventListener('mousedown', e => {
  if (e.button===1||e.button===2) {
    e.preventDefault();
    me.panning=true; me.panStartX=e.clientX-me.panX; me.panStartY=e.clientY-me.panY;
    wrap.style.cursor='grabbing'; return;
  }
  if (!me.key) return;
  const p = meGetCoords(e);

  if (me.tool==='anchor') {
    if (!maskLib[me.key]) initMaskLib(me.key, loadedAssets[me.key].frames.length);
    maskLib[me.key].anchors[me.frameIdx] = {x:p.x,y:p.y};
    drawMeOverlay();
    setSt('editorStatus',`Anchor set: (${p.x},${p.y})`,'ok');
    return;
  }

  if (me.tool==='wand') {
    if (!maskLib[me.key]) initMaskLib(me.key, loadedAssets[me.key].frames.length);
    floodFillSelect(p.x, p.y, e.altKey);
    return;
  }

  if (me.tool==='range') {
    if (!maskLib[me.key]) initMaskLib(me.key, loadedAssets[me.key].frames.length);
    colorRangeSelect(p.x, p.y, e.altKey);
    return;
  }

  if (me.tool==='lasso') {
    me.lassoing=true; me.lassoExclude=e.altKey; me.lassoPts=[p];
  }
});

wrap.addEventListener('mousemove', e => {
  if (me.panning) { me.panX=e.clientX-me.panStartX; me.panY=e.clientY-me.panStartY; meApplyTransform(); return; }
  if (me.lassoing) {
    const p=meGetCoords(e);
    const last=me.lassoPts[me.lassoPts.length-1];
    if (Math.abs(p.x-last.x)+Math.abs(p.y-last.y)>=1) { me.lassoPts.push(p); drawLassoPath(); }
  }
});

wrap.addEventListener('mouseup', e => {
  if (me.panning) { me.panning=false; wrap.style.cursor='crosshair'; return; }
  if (me.lassoing) { me.lassoing=false; finalizeLasso(); }
});

wrap.addEventListener('mouseleave', e => {
  if (me.panning) { me.panning=false; wrap.style.cursor=''; }
  if (me.lassoing) { me.lassoing=false; me.lassoPts=[]; drawMeOverlay(); }
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const old=me.zoom, d=e.deltaY<0?0.15:-0.15;
  me.zoom=Math.min(8,Math.max(0.2,me.zoom+d));
  const rect=wrap.getBoundingClientRect();
  const cx=e.clientX-rect.left-rect.width/2, cy=e.clientY-rect.top-rect.height/2;
  const r=me.zoom/old; me.panX=cx-(cx-me.panX)*r; me.panY=cy-(cy-me.panY)*r;
  meApplyTransform();
},{passive:false});

wrap.addEventListener('contextmenu', e => e.preventDefault());

// ── Lasso ──
function drawLassoPath() {
  const mo=document.getElementById('meOverlay');
  const ctx=mo.getContext('2d');
  drawMeOverlay();
  if (me.lassoPts.length<2) return;
  ctx.strokeStyle=me.lassoExclude?'#ff4455':'#7c3aed';
  ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(me.lassoPts[0].x,me.lassoPts[0].y);
  for(let i=1;i<me.lassoPts.length;i++) ctx.lineTo(me.lassoPts[i].x,me.lassoPts[i].y);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle=me.lassoExclude?'rgba(255,68,85,0.12)':'rgba(124,58,237,0.12)';
  ctx.fill(); ctx.setLineDash([]);
}

function finalizeLasso() {
  if (me.lassoPts.length<3||!me.key) return;
  const mc=document.getElementById('meCanvas');
  const w=mc.width, h=mc.height;
  const pts=me.lassoPts, n=pts.length;
  let minX=w,maxX=0,minY=h,maxY=0;
  for(const p of pts){if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y;}
  minX=Math.max(0,Math.floor(minX));maxX=Math.min(w-1,Math.ceil(maxX));
  minY=Math.max(0,Math.floor(minY));maxY=Math.min(h-1,Math.ceil(maxY));

  if (!maskLib[me.key]) initMaskLib(me.key, loadedAssets[me.key].frames.length);
  const region=me.region;
  if (!maskLib[me.key][region][me.frameIdx]) maskLib[me.key][region][me.frameIdx]=new Uint8Array(w*h);
  const mask=maskLib[me.key][region][me.frameIdx];

  pushHistory();
  let count=0;
  for(let y=minY;y<=maxY;y++) for(let x=minX;x<=maxX;x++){
    let inside=false;
    for(let i=0,j=n-1;i<n;j=i++){
      const yi=pts[i].y,yj=pts[j].y,xi=pts[i].x,xj=pts[j].x;
      if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    }
    if(inside){ mask[y*w+x]=me.lassoExclude?0:1; count++; }
  }
  me.lassoPts=[];
  drawMeOverlay(); updateRegionDots(); renderAssetGrid();
  setSt('editorStatus',`${me.lassoExclude?'Excluded':'Included'} ${count}px on frame ${me.frameIdx+1}`,'ok');
}

// ── HSL color distance (perceptually accurate for fabric/clothing) ──
function rgbToHsl(r, g, b) {
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  if (mx===mn) return [0,0,l*100];
  const d=mx-mn, s=l>0.5?d/(2-mx-mn):d/(mx+mn);
  let h;
  if(mx===r) h=((g-b)/d+(g<b?6:0))/6;
  else if(mx===g) h=((b-r)/d+2)/6;
  else h=((r-g)/d+4)/6;
  return [h*360, s*100, l*100];
}

function hslDist(r1,g1,b1, r2,g2,b2) {
  const [h1,s1,l1]=rgbToHsl(r1,g1,b1);
  const [h2,s2,l2]=rgbToHsl(r2,g2,b2);
  let dh=Math.abs(h1-h2); if(dh>180) dh=360-dh;
  // Hue weighted most (fabric color), lightness least (shadows are same color at different brightness)
  return Math.sqrt((dh*0.6)**2 + (s1-s2)**2 + ((l1-l2)*0.4)**2);
}

// ── Magic Wand — 8-connected BFS flood fill using HSL distance ──
function floodFillSelect(startX, startY, exclude) {
  if (!me.key) return;
  const mc = document.getElementById('meCanvas');
  const w = mc.width, h = mc.height;
  const srcData = mc.getContext('2d').getImageData(0, 0, w, h).data;

  const tol = parseInt(document.getElementById('meToleranceSlider')?.value || 40);

  const si = (startY * w + startX) * 4;
  const sr = srcData[si], sg = srcData[si+1], sb = srcData[si+2];

  pushHistory();
  if (!maskLib[me.key][me.region][me.frameIdx])
    maskLib[me.key][me.region][me.frameIdx] = new Uint8Array(w * h);
  const mask = maskLib[me.key][me.region][me.frameIdx];

  const visited = new Uint8Array(w * h);
  const startIdx = startY * w + startX;
  visited[startIdx] = 1;
  const queue = [startIdx];
  let count = 0;

  while (queue.length) {
    const idx = queue.pop();
    const px = idx % w, py = (idx / w) | 0;
    const di = idx * 4;
    if (srcData[di+3] <= 10) continue;
    const dist = hslDist(srcData[di],srcData[di+1],srcData[di+2], sr,sg,sb);
    if (dist > tol) continue;

    mask[idx] = exclude ? 0 : 1;
    count++;

    // 8-connected neighbors
    const left=px>0, right=px<w-1, up=py>0, down=py<h-1;
    if (left        && !visited[idx-1])   { visited[idx-1]=1;   queue.push(idx-1); }
    if (right       && !visited[idx+1])   { visited[idx+1]=1;   queue.push(idx+1); }
    if (up          && !visited[idx-w])   { visited[idx-w]=1;   queue.push(idx-w); }
    if (down        && !visited[idx+w])   { visited[idx+w]=1;   queue.push(idx+w); }
    if (left  && up && !visited[idx-w-1]) { visited[idx-w-1]=1; queue.push(idx-w-1); }
    if (right && up && !visited[idx-w+1]) { visited[idx-w+1]=1; queue.push(idx-w+1); }
    if (left  && down && !visited[idx+w-1]) { visited[idx+w-1]=1; queue.push(idx+w-1); }
    if (right && down && !visited[idx+w+1]) { visited[idx+w+1]=1; queue.push(idx+w+1); }
  }

  drawMeOverlay(); updateRegionDots(); renderAssetGrid();
  setSt('editorStatus', `Wand: ${exclude?'removed':'added'} ${count}px`, 'ok');
}

// ── Color Range — global similar-color selection using HSL ──
function colorRangeSelect(startX, startY, exclude) {
  if (!me.key) return;
  const mc = document.getElementById('meCanvas');
  const w = mc.width, h = mc.height;
  const srcData = mc.getContext('2d').getImageData(0, 0, w, h).data;

  const tol = parseInt(document.getElementById('meToleranceSlider')?.value || 40);

  const si = (startY * w + startX) * 4;
  const sr = srcData[si], sg = srcData[si+1], sb = srcData[si+2];

  pushHistory();
  if (!maskLib[me.key][me.region][me.frameIdx])
    maskLib[me.key][me.region][me.frameIdx] = new Uint8Array(w * h);
  const mask = maskLib[me.key][me.region][me.frameIdx];

  let count = 0;
  for (let i = 0; i < w * h; i++) {
    const di = i * 4;
    if (srcData[di+3] <= 10) continue;
    if (hslDist(srcData[di],srcData[di+1],srcData[di+2], sr,sg,sb) <= tol) {
      mask[i] = exclude ? 0 : 1; count++;
    }
  }

  drawMeOverlay(); updateRegionDots(); renderAssetGrid();
  setSt('editorStatus', `Range: ${exclude?'removed':'selected'} ${count}px`, 'ok');
}

// ── Grow / Shrink ──
function doGrowMask() {
  if (!me.key) return;
  const n = parseInt(document.getElementById('growPx')?.value || 2);
  const mc = document.getElementById('meCanvas');
  const w = mc.width, h = mc.height;
  if (!maskLib[me.key][me.region][me.frameIdx]) { setSt('editorStatus','No mask on this frame','err'); return; }
  pushHistory();
  for (let pass = 0; pass < n; pass++) {
    const mask = maskLib[me.key][me.region][me.frameIdx];
    const next = new Uint8Array(mask);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (mask[y*w+x]) continue;
      if ((x>0 && mask[y*w+x-1]) || (x<w-1 && mask[y*w+x+1]) ||
          (y>0 && mask[(y-1)*w+x]) || (y<h-1 && mask[(y+1)*w+x]))
        next[y*w+x] = 1;
    }
    maskLib[me.key][me.region][me.frameIdx] = next;
  }
  drawMeOverlay(); updateRegionDots();
  setSt('editorStatus', `Grew mask by ${n}px`, 'ok');
}

function doShrinkMask() {
  if (!me.key) return;
  const n = parseInt(document.getElementById('growPx')?.value || 2);
  const mc = document.getElementById('meCanvas');
  const w = mc.width, h = mc.height;
  if (!maskLib[me.key][me.region][me.frameIdx]) { setSt('editorStatus','No mask on this frame','err'); return; }
  pushHistory();
  for (let pass = 0; pass < n; pass++) {
    const mask = maskLib[me.key][me.region][me.frameIdx];
    const next = new Uint8Array(mask);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!mask[y*w+x]) continue;
      if (x===0||x===w-1||y===0||y===h-1 ||
          !mask[y*w+x-1]||!mask[y*w+x+1] ||
          !mask[(y-1)*w+x]||!mask[(y+1)*w+x])
        next[y*w+x] = 0;
    }
    maskLib[me.key][me.region][me.frameIdx] = next;
  }
  drawMeOverlay(); updateRegionDots();
  setSt('editorStatus', `Shrunk mask by ${n}px`, 'ok');
}

function meClearFrame() {

function meClearAll() {

function meCopyToPrev() { meFrameCopy(me.frameIdx, me.frameIdx-1); }
function meCopyToNext() { meFrameCopy(me.frameIdx, me.frameIdx+1); }

function meCopyToAll() {
  if (!me.key) return;
  const src=maskLib[me.key]?.[me.region]?.[me.frameIdx];
  const n=loadedAssets[me.key].frames.length;
  for (let i=0;i<n;i++) {
    if (i===me.frameIdx) continue;
    if (!maskLib[me.key][me.region]) maskLib[me.key][me.region]=new Array(n).fill(null);
    maskLib[me.key][me.region][i] = src?new Uint8Array(src):null;
  }
  updateRegionDots(); renderAssetGrid();
  setSt('editorStatus',`Copied to all ${n} frames`,'ok');
}

function meFrameCopy(from, to) {
  if (!me.key) return;
  const n=loadedAssets[me.key].frames.length;
  if (to<0||to>=n) return;
  const src=maskLib[me.key]?.[me.region]?.[from];
  if (!maskLib[me.key][me.region]) maskLib[me.key][me.region]=new Array(n).fill(null);
  maskLib[me.key][me.region][to] = src?new Uint8Array(src):null;
  setSt('editorStatus',`Copied to frame ${to+1}`,'ok');
}

function startMeAnim() {
  stopMeAnim();
  me.animPlaying=true; me.animIdx=0; me.animLast=performance.now(); me.animAccum=0;
  document.getElementById('mePlayBtn').textContent='⏸';
  me.animRAF=requestAnimationFrame(meAnimLoop);
}
function stopMeAnim() {
  me.animPlaying=false;
  if(me.animRAF){cancelAnimationFrame(me.animRAF);me.animRAF=null;}
  document.getElementById('mePlayBtn').textContent='▶';
}
function toggleMeAnim() { me.animPlaying?stopMeAnim():startMeAnim(); }

function meAnimLoop(ts) {
  if(!me.animPlaying||!me.key) return;
  const el=ts-me.animLast; me.animLast=ts; me.animAccum+=el;
  const frames=loadedAssets[me.key]?.frames||[];
  const dur=loadedAssets[me.key]?.durations[me.animIdx]||100;
  if(me.animAccum>=dur){ me.animAccum-=dur; me.animIdx=(me.animIdx+1)%Math.max(1,frames.length); }
  drawMeAnimFrame();
  me.animRAF=requestAnimationFrame(meAnimLoop);
}

function drawMeAnimFrame() {
  if(!me.key) return;
  const frames=loadedAssets[me.key]?.frames||[];
  if(!frames.length) return;
  const f=frames[me.animIdx];
  const ac=document.getElementById('meAnimCanvas');
  const scale=Math.min(148/f.width,110/f.height);
  ac.width=Math.round(f.width*scale); ac.height=Math.round(f.height*scale);
  const ctx=ac.getContext('2d'); ctx.clearRect(0,0,ac.width,ac.height);
  ctx.drawImage(f,0,0,ac.width,ac.height);
  const mask=maskLib[me.key]?.[me.region]?.[me.animIdx];
  if(mask) {
    const tmp=document.createElement('canvas'); tmp.width=f.width; tmp.height=f.height;
    const tc=tmp.getContext('2d');
    const id=tc.createImageData(f.width,f.height);
    const [r,g,b,a]=parseRgba(REGION_COLORS[me.region]);
    for(let i=0;i<mask.length;i++){if(!mask[i])continue;id.data[i*4]=r;id.data[i*4+1]=g;id.data[i*4+2]=b;id.data[i*4+3]=a;}
    tc.putImageData(id,0,0);
    ctx.drawImage(tmp,0,0,ac.width,ac.height);
  }
  document.getElementById('meAnimInfo').textContent=`${me.animIdx+1}/${frames.length}`;
}

async function importCSVFile(file) {
  if (!file) return;
  try {
    const lines=( await file.text()).trim().split('\n');
    const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
    let added=0;
    for (let i=1;i<lines.length;i++) {
      const cols=lines[i].split(',').map(c=>c.trim());
      const row={}; headers.forEach((h,j)=>row[h]=cols[j]||'');
      if (!row.casino_id&&!row.casino_name) continue;
      const id=row.casino_id||'casino_'+Date.now()+'_'+i;
      const p=makeDefaultPreset(id,row.casino_name||id);
      if(row.player_shirt) p.player.shirtColor=row.player_shirt;
      if(row.player_socks) p.player.sockColor=row.player_socks;
      if(row.player_pattern) p.player.pattern=row.player_pattern;
      if(row.pattern_color) p.player.patternColor=row.pattern_color;
      if(row.player_number) p.player.number=row.player_number;
      if(row.goalkeeper_shirt) p.goalkeeper.shirtColor=row.goalkeeper_shirt;
      if(row.goalkeeper_socks) p.goalkeeper.sockColor=row.goalkeeper_socks;
      if(row.goalkeeper_pattern) p.goalkeeper.pattern=row.goalkeeper_pattern;
      if(!row.player_shirt&&row.primary) p.player.shirtColor=row.primary;
      if(!row.player_socks&&row.secondary) p.player.sockColor=row.secondary;
      presets=presets.filter(x=>x.id!==id); presets.push(p); added++;
    }
    savePresetsToStorage();
    const st=document.getElementById('presetStatus');
    if(st){st.textContent=`Imported ${added} presets`;st.className='lp-status ok';}
  } catch(e) {
    const st=document.getElementById('presetStatus');
    if(st){st.textContent='CSV error: '+e.message;st.className='lp-status err';}
  }
}

// ═══════════════════════════════════════
//  RECOLOR + PATTERN ENGINE
// ═══════════════════════════════════════
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}

function getMaskBounds(mask, w, h) {
  let minX=w,maxX=0,minY=h,maxY=0,found=false;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) {
    if(mask[y*w+x]){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;found=true;}
  }
  return found?{minX,maxX,minY,maxY}:null;
}

function applyColorToMask(outData, srcData, mask, settings, w, h) {
  const {shirtColor, patternColor, pattern, patternWidth} = settings;
  const [r1,g1,b1] = hexToRgb(shirtColor);
  const [r2,g2,b2] = patternColor?hexToRgb(patternColor):[r1,g1,b1];

  let lumSum=0, lumCount=0;
  for(let i=0;i<mask.length;i++){
    if(!mask[i]) continue;
    const di=i*4; if(srcData[di+3]<=10) continue;
    lumSum+=(srcData[di]*0.299+srcData[di+1]*0.587+srcData[di+2]*0.114);
    lumCount++;
  }
  const baseLum=lumCount>0?lumSum/lumCount:128;
  const bounds = getMaskBounds(mask, w, h);
  const pw = patternWidth || 12;

  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const pi=y*w+x;
    if(!mask[pi]) continue;
    const di=pi*4; if(srcData[di+3]<=10) continue;
    let pr=r1, pg=g1, pb=b1;
    if(pattern==='vertical_stripes'){ if((x%(pw*2))>=pw){pr=r2;pg=g2;pb=b2;} }
    else if(pattern==='diagonal_stripe'){ if(((x+y)%(pw*2))>=pw){pr=r2;pg=g2;pb=b2;} }
    else if(pattern==='half_half'&&bounds){ if(y>=(bounds.minY+bounds.maxY)/2){pr=r2;pg=g2;pb=b2;} }
    const origLum=(srcData[di]*0.299+srcData[di+1]*0.587+srcData[di+2]*0.114);
    const scale=Math.min(origLum/Math.max(baseLum,1)*1.1, 2.2);
    outData[di]  =Math.min(255,Math.round(pr*scale));
    outData[di+1]=Math.min(255,Math.round(pg*scale));
    outData[di+2]=Math.min(255,Math.round(pb*scale));
  }
}

function renderNumberOnFrame(srcCanvas, anchor, settings) {
  const {number, color, size, stroke, strokeColor, bold, opacity} = settings;
  if (!anchor||!number) return srcCanvas;
  const w=srcCanvas.width, h=srcCanvas.height;
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  const tc=tmp.getContext('2d');
  tc.font=`${bold?'bold':'normal'} ${size}px Arial,sans-serif`;
  tc.textAlign='center'; tc.textBaseline='middle';
  if(stroke>0){tc.strokeStyle=strokeColor||'#000';tc.lineWidth=stroke*2;tc.lineJoin='round';tc.strokeText(number,anchor.x,anchor.y);}
  tc.fillStyle=color||'#FFF'; tc.fillText(number,anchor.x,anchor.y);
  const td=tc.getImageData(0,0,w,h).data;
  const out=cloneCanvas(srcCanvas);
  const outCtx=out.getContext('2d');
  const srcData=srcCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const id=outCtx.getImageData(0,0,w,h); const od=id.data;
  for(let i=0;i<od.length;i+=4){
    const ta=td[i+3]/255; if(ta<=0) continue;
    if(srcData[i+3]<=10) continue;
    const lum=(srcData[i]*0.299+srcData[i+1]*0.587+srcData[i+2]*0.114)/255;
    const shade=0.4+0.6*lum; const a=ta*(opacity||0.9);
    od[i]  =Math.round(od[i]*(1-a)+Math.min(255,td[i]*shade)*a);
    od[i+1]=Math.round(od[i+1]*(1-a)+Math.min(255,td[i+1]*shade)*a);
    od[i+2]=Math.round(od[i+2]*(1-a)+Math.min(255,td[i+2]*shade)*a);
  }
  outCtx.putImageData(id,0,0);
  return out;
}

function processFrameForCasino(frameCanvas, frameIdx, assetKey, preset, assetType) {
  const w=frameCanvas.width, h=frameCanvas.height;
  const out=cloneCanvas(frameCanvas);
  const outCtx=out.getContext('2d');
  const srcData=frameCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const id=outCtx.getImageData(0,0,w,h); const od=id.data; od.set(srcData);
  const isPlayer=assetType==='player';
  const kit=isPlayer?preset.player:preset.goalkeeper;
  const shirtMask=maskLib[assetKey]?.shirt?.[frameIdx];
  if(shirtMask) applyColorToMask(od, srcData, shirtMask, {shirtColor:kit.shirtColor,patternColor:kit.patternColor,pattern:kit.pattern,patternWidth:kit.patternWidth}, w, h);
  const sockMask=maskLib[assetKey]?.socks?.[frameIdx];
  if(sockMask) applyColorToMask(od, srcData, sockMask, {shirtColor:kit.sockColor,patternColor:null,pattern:'solid',patternWidth:0}, w, h);
  outCtx.putImageData(id,0,0);
  let result=out;
  if(isPlayer&&preset.player.number){
    // Fall back to any available anchor if this specific frame doesn't have one placed
    const anchor = maskLib[assetKey]?.anchors?.[frameIdx]
      || maskLib[assetKey]?.anchors?.find(a => a != null)
      || null;
    if(anchor) result=renderNumberOnFrame(result, anchor, {number:preset.player.number,color:preset.player.numberColor||'#FFF',size:42,stroke:1.5,strokeColor:'#000',bold:true,opacity:0.9});
  }
  return result;
}

async function genPreview() {
  const ids=getSelectedCasinoIds();
  if(!ids.length){setSt('exportStatus','Select at least one casino','err');return;}
  const preset=presets.find(p=>p.id===ids[0]);
  if(!preset) return;
  if(!loadedAssets.player){setSt('exportStatus','player.webp not loaded','err');return;}
  setSt('exportStatus','Generating preview…');
  const {frames,durations}=loadedAssets.player;
  genBeforeFrames=frames;
  genAfterFrames=[];
  for(let i=0;i<frames.length;i++){
    genAfterFrames.push(processFrameForCasino(frames[i],i,'player',preset,'player'));
    await yld();
  }
  genShowAfter=true;
  document.getElementById('btnToggleBA').style.display='';
  document.getElementById('btnToggleBA').textContent='Show: After';
  startGenPreviewAnim(genAfterFrames, durations);
  setSt('exportStatus',`Preview: ${preset.name}`,'ok');
}

function toggleBeforeAfter() {
  genShowAfter=!genShowAfter;
  document.getElementById('btnToggleBA').textContent='Show: '+(genShowAfter?'After':'Before');
  const f=genShowAfter?genAfterFrames:genBeforeFrames;
  if(f&&loadedAssets.player) startGenPreviewAnim(f, loadedAssets.player.durations);
}

function startGenPreviewAnim(frames, durs) {
  genAnimFrames=frames; genAnimDurs=durs;
  if(genAnimRAF) clearTimeout(genAnimRAF);
  genAnimIdx=0; genAnimLast=performance.now();
  const canvas=document.getElementById('genPreviewCanvas');
  canvas.style.display=''; document.getElementById('genPreviewMsg').style.display='none';
  genAnimLoop(genAnimLast);
}

function genAnimLoop(ts) {
  if(!genAnimFrames||!genAnimFrames.length) return;
  const dur=genAnimDurs?.[genAnimIdx]||100;
  const canvas=document.getElementById('genPreviewCanvas');
  const f=genAnimFrames[genAnimIdx];
  canvas.width=f.width; canvas.height=f.height;
  canvas.getContext('2d').drawImage(f,0,0);
  genAnimIdx=(genAnimIdx+1)%genAnimFrames.length;
  genAnimRAF=setTimeout(()=>genAnimLoop(performance.now()), dur);
}

async function startExport() {
  const exportMode=document.querySelector('input[name=exportMode]:checked')?.value||'selected';
  const pkgMode=document.querySelector('input[name=pkgMode]:checked')?.value||'individual';
  let casinoIds=exportMode==='all'?presets.map(p=>p.id):getSelectedCasinoIds();
  if(!casinoIds.length){setSt('exportStatus','No casinos selected','err');return;}
  if(!Object.keys(loadedAssets).length){setSt('exportStatus','Load assets folder first','err');return;}

  document.getElementById('progressBar').style.display='';
  document.getElementById('progressLog').style.display='';
  document.getElementById('progressLog').innerHTML='';
  document.getElementById('exportBtn').disabled=true;
  setSt('exportStatus','Exporting…');

  try {
    const masterZip=new JSZip();
    const total=casinoIds.length;
    for(let ci=0;ci<casinoIds.length;ci++){
      const preset=presets.find(p=>p.id===casinoIds[ci]);
      if(!preset) continue;
      log(`Processing: ${preset.name}…`);
      setProgress((ci/total)*0.9);
      try {
        const casinoZip=new JSZip();
        const masterFolder=(pkgMode==='master'||pkgMode==='both')?masterZip.folder(preset.id):null;
        for(const def of REGISTRY){
          let webpBlob;
          if(loadedAssets[def.key]){
            const {frames,durations}=loadedAssets[def.key];
            const processed=[];
            for(let fi=0;fi<frames.length;fi++){ processed.push(processFrameForCasino(frames[fi],fi,def.key,preset,def.type)); await yld(); }
            webpBlob=await encodeAnimatedWebP(processed,durations);
          }
          if(webpBlob){ casinoZip.file(def.file,webpBlob); if(masterFolder) masterFolder.file(def.file,webpBlob); }
        }
        for(const [name,file] of Object.entries(staticFiles)){
          const buf=await file.arrayBuffer();
          casinoZip.file(name,buf); if(masterFolder) masterFolder.file(name,buf);
        }
        if(pkgMode==='individual'||pkgMode==='both'){
          dlBlob(await casinoZip.generateAsync({type:'blob'}),`${preset.id}_football_shootout.zip`);
        }
        log(`✓ ${preset.name}`,'ok');
      } catch(err){ log(`✗ ${preset.name}: ${err.message}`,'err'); }
    }
    if(pkgMode==='master'||pkgMode==='both'){
      setSt('exportStatus','Building master ZIP…');
      dlBlob(await masterZip.generateAsync({type:'blob',onUpdate:m=>setProgress(0.9+m.percent/1000)}),'all_football_shootout_assets.zip');
    }
    setProgress(1);
    setSt('exportStatus',`Done — ${casinoIds.length} casino(s) exported`,'ok');
  } catch(e){
    setSt('exportStatus','Export error: '+e.message,'err');
    log('Fatal: '+e.message,'err');
  }
  document.getElementById('exportBtn').disabled=false;
}

function setProgress(v) { document.getElementById('progressFill').style.width=Math.round(v*100)+'%'; }

function log(msg, type='') {
  const el=document.getElementById('progressLog');
  const line=document.createElement('div');
  line.className=type?'log-'+type:'';
  line.textContent=msg; el.appendChild(line); el.scrollTop=el.scrollHeight;
}

// ═══════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════
function switchTab(t) {
  const map={mask:'Mask',presets:'Presets',gen:'Gen'};
  Object.entries(map).forEach(([key,Cap])=>{
    document.getElementById('pane'+Cap).classList.toggle('hidden',key!==t);
    const nb=document.getElementById('nb'+Cap);
    if(nb) nb.classList.toggle('active',key===t);
  });
  if(t==='presets') renderCasinoList();
  if(t==='gen') { renderGenStatus(); renderGenCasinoList(); }
}

// ═══════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════
function cloneCanvas(src) {
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  c.getContext('2d').drawImage(src,0,0); return c;
}

function dlBlob(blob, name) {
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function yld() { return new Promise(r=>setTimeout(r,0)); }

function updateChips() {
  const al=Object.keys(loadedAssets).length;
  const ec=document.getElementById('chipAssets');
  if(ec){ec.textContent=`Assets ${al}/9`;ec.className='nav-chip'+(al===9?' ok':al>0?' warn':'');}

  const mr=REGISTRY.filter(d=>{const c=getMaskCoverage(d.key);return c.shirt>0;}).length;
  const em=document.getElementById('chipMasks');
  if(em){em.textContent=`Masks ${mr}/9`;em.className='nav-chip'+(mr===9?' ok':mr>0?' warn':'');}

  const ep=document.getElementById('chipPresets');
  if(ep){ep.textContent=`Presets ${presets.length}`;ep.className='nav-chip'+(presets.length>0?' ok':'');}

  setSt('folderStatus','','');
}

// ── Tolerance slider wiring ──
document.getElementById('meToleranceSlider').addEventListener('input', function() {
  document.getElementById('meTolVal').textContent = this.value;
});

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); doRedo(); }
});

// ── Browser check ──
if(typeof ImageDecoder==='undefined'){
  document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#451a03;color:#fed7aa;border-bottom:2px solid #f97316;padding:8px 16px;font-size:11px;font-weight:500;">⚠ ImageDecoder API not available — only single-frame WebP will load. Use Chrome or Edge for full animated WebP support.</div>');
}

// ── Init ──
renderAssetGrid();
renderCasinoList();
updateChips();
</script>
